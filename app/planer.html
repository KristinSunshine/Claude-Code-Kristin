<style>
/* Layout: app shell with left nav (top tabs on phones) and one working area; all colors are tokens, channel colors come from the shared config. */
:root {
  --bg: #f7f6f9; --surface: #ffffff; --sunken: #efedf2; --fg: #1f1b24; --muted: #625b6b; --line: #ddd9e2;
  --accent: #5c3a6e; --accent-fg: #ffffff; --warn: #a65400; --warn-bg: #fff1df; --ok: #1f7a46; --ok-bg: #e6f4ec; --bad: #b3261e; --bad-bg: #fdeceb;
  --info: #2f6db5;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17141b; --surface: #211d26; --sunken: #1b1820; --fg: #ece8f0; --muted: #a49cae; --line: #36303d;
    --accent: #c9a5dc; --accent-fg: #1f1b24; --warn: #ffb35c; --warn-bg: #3a2a17; --ok: #5fd08f; --ok-bg: #173225; --bad: #ff8a80; --bad-bg: #3a1c1a;
    --info: #7fb0f0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17141b; --surface: #211d26; --sunken: #1b1820; --fg: #ece8f0; --muted: #a49cae; --line: #36303d;
  --accent: #c9a5dc; --accent-fg: #1f1b24; --warn: #ffb35c; --warn-bg: #3a2a17; --ok: #5fd08f; --ok-bg: #173225; --bad: #ff8a80; --bad-bg: #3a1c1a;
  --info: #7fb0f0; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.2; text-wrap: balance; }

p { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); } .small { font-size: 0.85rem; } .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100%; }
nav.side { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; padding: 20px 12px 20px max(12px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; background: var(--surface); }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; padding: 4px 10px 14px; }
.brand small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 0.75rem; color: var(--muted); }
.navlink { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 8px; color: var(--fg); text-decoration: none; font-weight: 500; }
.navlink:hover { background: var(--sunken); }
.navlink.on { background: var(--fg); color: var(--bg); }
.badge { font-family: var(--font-mono); font-size: 0.7rem; min-width: 20px; text-align: center; padding: 1px 6px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); }
.whoami { margin-top: auto; padding: 10px; border-top: 1px solid var(--line); font-size: 0.85rem; display: flex; gap: 8px; align-items: center; }

main { min-width: 0; padding-block: 24px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.view { max-width: 1200px; margin: 0 auto; display: grid; gap: 20px; }
.view-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px; }
.view-head p { max-width: 70ch; }
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  nav.side { position: sticky; z-index: 5; height: auto; flex-direction: row; overflow-x: auto; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); border-right: 0; border-bottom: 1px solid var(--line); }
  .brand, .whoami { display: none; }
  .navlink { white-space: nowrap; }
}

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start; }
.scroll-x { overflow-x: auto; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.stack { display: grid; gap: 10px; }
.empty { padding: 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }
.banner { padding: 12px 14px; border-radius: 8px; background: var(--warn-bg); color: var(--fg); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.banner b { color: var(--warn); }

.team-tbl td:nth-child(1) input { min-width: 170px; } .team-tbl td:nth-child(2) input { min-width: 150px; }
.btn { text-decoration: none; display: inline-block; font: inherit; font-weight: 600; font-size: 0.88rem; border: 1px solid var(--fg); border-radius: 8px; padding: 7px 14px; background: var(--fg); color: var(--bg); cursor: pointer; white-space: nowrap; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }

.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.sm { padding: 4px 10px; font-size: 0.8rem; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.iconbtn { font: inherit; background: none; border: 0; cursor: pointer; color: var(--muted); padding: 2px 6px; border-radius: 6px; }
.iconbtn:hover { background: var(--sunken); color: var(--fg); }

label.f { display: grid; gap: 4px; font-size: 0.82rem; font-weight: 600; min-width: 0; }
label.f span.hint { font-weight: 400; color: var(--muted); }
input[type=text], input[type=date], input[type=time], input[type=number], input[type=url], select, textarea {
  font: inherit; font-size: 0.92rem; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 90px; line-height: 1.5; }
input[type=color] { width: 40px; height: 32px; border: 1px solid var(--line); border-radius: 6px; padding: 2px; background: var(--surface); }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.form .wide { grid-column: 1 / -1; }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 0.75rem; padding: 1px 8px; border-radius: 999px; background: color-mix(in srgb, var(--c, var(--muted)) 16%, var(--surface)); white-space: nowrap; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; }
.chip.dashed { background: transparent; border: 1px dashed var(--muted); color: var(--muted); }
.togg { font: inherit; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line)); background: color-mix(in srgb, var(--c) 14%, var(--surface)); color: var(--fg); }
.togg i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.togg[aria-pressed="false"] { background: transparent; color: var(--muted); border-color: var(--line); text-decoration: line-through; }
.togg[aria-pressed="false"] i { background: transparent; border: 1px solid var(--muted); }

.status { display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--line); color: var(--muted); }
.st-arbeit { color: var(--info); border-color: currentColor; }
.st-review { color: var(--warn); border-color: currentColor; background: var(--warn-bg); }
.st-frei { color: var(--ok); border-color: currentColor; background: var(--ok-bg); }
.st-live { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.overdue { color: var(--bad); font-weight: 600; }

/* Calendar */
.cal-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.cal-bar h2 { min-width: 11ch; }
.cal { min-width: 760px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); background: var(--surface); }
.cal .dow { font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 6px 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--sunken); }
.cal .day { min-height: 112px; padding: 4px 5px 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cal .day.out { background: var(--sunken); }
.cal .day.out .dnum { opacity: 0.5; }
.cal .day.today .dnum { background: var(--accent); color: var(--accent-fg); border-radius: 999px; padding: 0 6px; }
.dhead { display: flex; justify-content: space-between; align-items: center; }
.dnum { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }
.add { opacity: 0; font-size: 0.9rem; line-height: 1; }
.day:hover .add, .add:focus-visible { opacity: 1; }
.entry { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 0.72rem; line-height: 1.25; padding: 2px 5px; border-radius: 4px; background: color-mix(in srgb, var(--c) 17%, var(--surface)); min-width: 0; }
.entry:focus-visible { outline: 2px solid var(--accent); }
.entry i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }
.entry span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.entry.solid { background: var(--c); color: #fff; font-weight: 600; }
.entry.solid i { background: #fff; }
.entry.dashed { background: transparent; border: 1px dashed var(--muted); color: var(--muted); }
.entry.dashed i { background: var(--muted); }
.entry em { font-style: normal; flex: none; width: 7px; height: 7px; border-radius: 50%; border: 1px solid currentColor; opacity: 0.7; }
.entry em.full { background: currentColor; }
.clash { font-size: 0.68rem; color: var(--warn); background: var(--warn-bg); border-radius: 4px; padding: 1px 5px; font-weight: 600; }

/* Tables */
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
th { text-align: left; font-family: var(--font-mono); font-weight: 500; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--fg); white-space: nowrap; }
th button { all: unset; cursor: pointer; }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--sunken); }
.tbl { min-width: 860px; }

/* Lists */
.list { display: grid; }
.li { display: grid; grid-template-columns: 4.2rem minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 4px; border-top: 1px solid var(--line); align-items: start; cursor: pointer; }
.li:first-child { border-top: 0; }
.li:hover { background: var(--sunken); }
.li .d { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); padding-top: 2px; }
.li .t { display: grid; gap: 3px; min-width: 0; }
.li .t b { font-weight: 600; overflow-wrap: anywhere; }
.li .t span { font-size: 0.8rem; color: var(--muted); }

/* Tree */
.tree { display: grid; gap: 22px; }
.pillar { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 0 18px; }
.pillar-head { border: 2px solid var(--fg); border-radius: 8px; padding: 10px 12px; align-self: start; display: grid; gap: 4px; }
.pillar-head b { font-family: var(--font-display); font-size: 1.05rem; }
.topics { display: grid; gap: 10px; border-left: 2px solid var(--line); padding-left: 0; }
.topic { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 8px; position: relative; padding-left: 22px; }
.topic::before { content: ""; position: absolute; left: 0; top: 17px; width: 18px; height: 2px; background: var(--line); }
.topic-name { padding: 6px 10px; background: var(--sunken); border-radius: 8px; font-weight: 600; font-size: 0.9rem; display: grid; gap: 2px; }
.topic-name small { font-weight: 400; color: var(--muted); font-size: 0.75rem; }
.posts { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 5px; align-content: start; }
.gap { font-size: 0.72rem; color: var(--warn); background: var(--warn-bg); border-radius: 4px; padding: 1px 6px; }
@media (max-width: 860px) { .pillar, .topic { grid-template-columns: 1fr; } .topics { border-left: 0; } .topic { padding-left: 0; } .topic::before { display: none; } }

/* AI */
.ai-out { white-space: pre-wrap; background: var(--sunken); border-radius: 8px; padding: 12px; font-size: 0.92rem; }
.thinking { color: var(--muted); font-style: italic; }
.prop td input, .prop td select { font-size: 0.82rem; padding: 4px 6px; }
.prop td { padding: 5px 4px; }

/* Dialog */
dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px); background: var(--surface); color: var(--fg); }
dialog::backdrop { background: rgb(20 16 26 / 0.45); }
.dlg { display: grid; gap: 16px; padding: 20px; }
.dlg-head { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.dlg-foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 14px; }
.comments { display: grid; gap: 8px; }
.comment { background: var(--sunken); border-radius: 8px; padding: 8px 10px; font-size: 0.88rem; }
.comment .meta { font-size: 0.75rem; color: var(--muted); }
.comment p { white-space: pre-wrap; overflow-wrap: anywhere; }
.checkline { display: flex; gap: 8px; align-items: center; }
.checkline input[type=text] { flex: 1; }

.toast { position: fixed; z-index: 50; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 0.9rem; max-width: calc(100vw - 32px); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); display: grid; gap: 2px; }
.kpi b { font-family: var(--font-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 0.8rem; color: var(--muted); }
.steps td input, .steps td select { font-size: 0.82rem; padding: 4px 6px; }
.steps td { padding: 4px; }
details.panel > summary { cursor: pointer; font-weight: 600; }
details.panel[open] > summary { margin-bottom: 12px; }
.pchips { display: flex; flex-wrap: wrap; gap: 6px; }
.pchips label { display: inline-flex; gap: 5px; align-items: center; font-size: 0.8rem; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; }
@media (prefers-reduced-motion: no-preference) { .entry, .togg, .btn { transition: background-color .15s ease, opacity .15s ease; } }
</style>

<div class="shell">
  <nav class="side" id="nav" aria-label="Bereiche"></nav>
  <main id="main"><div class="view"><p class="muted">Planer wird geladen …</p></div></main>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  "use strict";
  // ---------- State ----------
  var S = {
    db: null, user: null, sample: null, assets: null, downloads: null,
    uid: null, viewer: null, lastSeen: 0, readonly: false,
    config: null, people: [], items: [], events: [], series: [], knowledge: [],
    loaded: {}, timedOut: false,
    view: "heute", cal: null, hidden: {}, table: { sort: "date", dir: 1, ch: "", st: "", p: "", q: "" },
    draft: { text: "", busy: false, proposal: null, error: "" },
    freq: { busy: false, text: "" }, pillarAi: { text: "", busy: false, result: null },
    dirty: false
  };
  var STATUS = [["idee", "Idee"], ["arbeit", "in Arbeit"], ["review", "zur Freigabe"], ["frei", "freigegeben"], ["live", "veröffentlicht"]];
  var GROUPS = [["intern-offline", "Intern · offline"], ["intern-online", "Intern · online"], ["extern", "Externe Events"]];
  var KKINDS = [["tov", "Tone of Voice"], ["dodont", "Do & Don't"], ["wording", "Wortliste"], ["persona", "Zielgruppe / Persona"], ["design", "Design & Vorlagen"], ["md", "Manifestation Days"], ["other", "Sonstiges"]];
  try { S.hidden = JSON.parse(localStorage.getItem("fp-hidden") || "{}") || {}; } catch (e) { S.hidden = {}; }
  var now = new Date(); S.cal = { y: now.getFullYear(), m: now.getMonth() };

  // ---------- Helpers ----------
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pad(n) { return String(n).padStart(2, "0"); }
  function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parse(s) { var p = String(s).split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return iso(d); }
  function today() { return iso(new Date()); }
  function validDate(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || "")); }
  function fmt(s) { return validDate(s) ? pad(parse(s).getDate()) + "." + pad(parse(s).getMonth() + 1) + "." : "–"; }
  function fmtLong(s) { return validDate(s) ? parse(s).toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" }) : "–"; }
  function uidGen(p) { return (p || "x") + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function val(id) { var el = document.getElementById(id); return el ? el.value : ""; }
  function toast(msg) { var t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 3200); }
  function clone(o) { return JSON.parse(JSON.stringify(o || null)); }

  function cfg() { return S.config || DEFAULT_CONFIG; }
  function channel(id) { return cfg().channels.find(function (c) { return c.id === id; }); }
  function chColor(id) { var c = channel(id); return c ? c.color : "#888888"; }
  function chName(id) { var c = channel(id); return c ? c.name : (id ? id : "Aufgabe"); }
  function person(id) { return S.people.find(function (p) { return p.id === id; }); }
  function pName(id) { var p = person(id); return p ? p.name : "nicht zugewiesen"; }
  function firstName(id) { var p = person(id); return p ? p.name.split(" ")[0] : "–"; }
  function category(id) { return cfg().categories.find(function (c) { return c.id === id; }); }
  function topic(id) { var r = null; cfg().pillars.forEach(function (p) { (p.topics || []).forEach(function (t) { if (t.id === id) r = { pillar: p, topic: t }; }); }); return r; }
  function chip(color, label, extra) { return '<span class="chip ' + (extra || "") + '" style="--c:' + esc(color) + '"><i></i>' + esc(label) + "</span>"; }
  function statusBadge(st) { var s = STATUS.find(function (x) { return x[0] === st; }) || STATUS[0]; return '<span class="status st-' + s[0] + '">' + s[1] + "</span>"; }
  function me() { return S.people.find(function (p) { return S.uid && p.userId === S.uid; }) || person(localGet("fp-me")); }
  function localGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function localSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lead() { return S.people.find(function (p) { return p.isLead; }) || S.people[0]; }

  // Manifestation-Days periods from series
  function seriesEntries(s) { return (s.entries || []).map(function (e) { return { date: addDays(s.start, Number(e.offset) || 0), title: e.title, type: e.type, time: e.time, series: s }; }); }
  function mdPeriods() { return S.series.filter(function (s) { return validDate(s.start); }).map(function (s) { var offs = (s.entries || []).map(function (e) { return Number(e.offset) || 0; }); var max = offs.length ? Math.max.apply(null, offs) : 11; return { from: s.start, to: addDays(s.start, Math.max(max, 0)), name: s.name }; }); }
  function inMd(date) { return mdPeriods().some(function (p) { return date >= p.from && date <= p.to; }); }
  function openCount(pid) { return S.items.filter(function (i) { return i.assignee === pid && i.status !== "live"; }).length; }
  function assigneeFor(ch, date) {
    if (!ch) return lead() ? lead().id : "";
    var act = S.people.filter(function (p) { return p.active !== false; });
    if (date && inMd(date)) { var md = act.filter(function (p) { return (p.mdChannels || []).indexOf(ch) >= 0; }); if (md.length) return md[0].id; }

  // ---------- AI ----------
  function knowledgeText(channelId, max) {
    var parts = [];
    S.knowledge.filter(function (k) { return ["tov", "dodont", "wording", "persona"].indexOf(k.kind) >= 0 && (!k.channel || !channelId || k.channel === channelId); }).forEach(function (k) {
      parts.push("### " + (KKINDS.find(function (x) { return x[0] === k.kind; }) || [0, ""])[1] + ": " + k.title + (k.channel ? " (" + chName(k.channel) + ")" : "") + "\n" + (k.text || ""));
    });
    var s = parts.join("\n\n");
    return s.length > (max || 60000) ? s.slice(0, max || 60000) + "\n[gekürzt]" : s;
  }
  function planningContext() {
    var t = today(), until = addDays(t, 70);
    var lines = [];
    lines.push("Heute ist " + t + " (" + fmtLong(t) + ").");
    lines.push("KANÄLE (id: Name): " + cfg().channels.map(function (c) { return c.id + ": " + c.name; }).join("; "));
    lines.push("TEAM (id: Name – zuständig für):\n" + S.people.filter(function (p) { return p.active !== false; }).map(function (p) { return "- " + p.id + ": " + p.name + " – " + (p.role || "") + "; Kanäle: " + ((p.channels || []).join(", ") || "keine") + ((p.mdChannels || []).length ? "; während Manifestation Days zusätzlich: " + p.mdChannels.join(", ") : "") + (p.isLead ? "; Stellvertretung für alle" : ""); }).join("\n"));
    lines.push("EVENT-KATEGORIEN (id: Name, Gruppe, Schritte in Tagen relativ zum Event):\n" + cfg().categories.map(function (c) { return "- " + c.id + ": " + c.name + " (" + c.group + ")" + (c.blocker ? " – Blocker, kein Content" : " – " + (c.steps || []).map(function (s) { return s.offset + "d " + (s.channel || "Aufgabe") + " " + s.title; }).join(" | ")); }).join("\n"));
    lines.push("THEMEN (id: Säule > Thema):\n" + (cfg().pillars.map(function (p) { return (p.topics || []).map(function (tp) { return "- " + tp.id + ": " + p.name + " > " + tp.name; }).join("\n"); }).join("\n") || "noch keine"));
    lines.push("BEREITS GEPLANT bis " + until + ":\n" + (S.items.filter(function (i) { return i.date >= t && i.date <= until; }).sort(function (a, b) { return a.date.localeCompare(b.date); }).map(function (i) { return "- " + i.date + " " + i.channel + ": " + i.title; }).join("\n") || "nichts"));
    lines.push("EVENTS bis " + until + ":\n" + (S.events.filter(function (e) { return e.start >= t && e.start <= until; }).map(function (e) { return "- " + e.start + (e.end ? " bis " + e.end : "") + ": " + e.title; }).join("\n") || "keine"));
    lines.push("MANIFESTATION-DAYS-PHASEN (tägliche Mails, Mail-Überschneidungen vermeiden): " + (mdPeriods().map(function (p) { return p.from + " bis " + p.to; }).join(", ") || "keine geplant"));
    lines.push("Abgabe zur Freigabe: " + (cfg().reviewDays || 0) + " Tage vor Veröffentlichung.");
    return lines.join("\n\n");
  }
  function aiErr(e) {
    var c = e && e.code;
    if (c === "not_granted" || c === "sampling_disabled") return "Die KI ist für dich nicht freigegeben.";
    if (c === "rate_limited") return "Dein KI-Kontingent ist gerade ausgeschöpft. Bitte später nochmal versuchen.";
    if (c === "invalid_json") return "Die Antwort der KI war unvollständig. Bitte noch einmal versuchen, eventuell mit kürzerer Beschreibung.";
    if (c === "prompt_too_large") return "Der Text ist zu lang. Bitte kürzen.";
    if (c === "refused") return "Die KI hat diese Anfrage abgelehnt. Bitte anders formulieren.";
    if (c === "cancelled") return "";

    "save-know": function () { var k = JSON.parse(dlg.dataset.know || "{}"); k.title = val("k-title").trim() || "Ohne Titel"; k.kind = val("k-kind"); k.channel = val("k-channel"); k.text = val("k-text").slice(0, 200000); k.files = readFiles(); closeDlg(); saveKnowledge(k).then(function () { toast("Gespeichert"); }, function () {}); },
    "del-know": function (el) { if (el.dataset.confirm !== "1") { el.dataset.confirm = "1"; el.textContent = "Wirklich löschen?"; return; } var k = JSON.parse(dlg.dataset.know || "{}"); delDoc("knowledge/" + k.id).catch(function () {}); closeDlg(); },
    "cal-prev": function () { S.cal.m--; if (S.cal.m < 0) { S.cal.m = 11; S.cal.y--; } render(true); },
    "cal-next": function () { S.cal.m++; if (S.cal.m > 11) { S.cal.m = 0; S.cal.y++; } render(true); },
    "cal-today": function () { var d = new Date(); S.cal = { y: d.getFullYear(), m: d.getMonth() }; render(true); },
    "toggle": function (el) { var k = el.dataset.k; S.hidden[k] = !S.hidden[k]; localSet("fp-hidden", JSON.stringify(S.hidden)); render(true); },
    "sort": function (el) { var k = el.dataset.k; if (S.table.sort === k) S.table.dir *= -1; else { S.table.sort = k; S.table.dir = 1; } render(true); },
    "draft-ai": runDraftAi,
    "draft-clear": function () { S.draft = { text: "", busy: false, proposal: null, error: "" }; render(true); },
    "draft-addrow": function () { var d = today(); S.draft.proposal.items.push({ on: true, date: d, due: d, channel: "", format: "", title: "", assignee: "", topic: "", brief: "" }); render(true); },
    "draft-confirm": confirmDraft,
    "freq": runFreq,
    "add-pillar": function () { openPillar(null); },
    "edit-pillar": function (el) { openPillar(Number(el.dataset.i)); },
    "save-pillar": function (el) {
      var c = clone(cfg()), name = val("pl-name").trim(); if (!name) { toast("Bitte einen Namen eingeben."); return; }
      var data = { name: name, desc: val("pl-desc").trim(), share: Number(val("pl-share")) || 0 };
      if (el.dataset.i === "") c.pillars.push(Object.assign({ id: uidGen("p"), topics: [] }, data)); else Object.assign(c.pillars[Number(el.dataset.i)], data);
      closeDlg(); saveConfig(c);
    },
    "del-pillar": function (el) { if (el.dataset.confirm !== "1") { el.dataset.confirm = "1"; el.textContent = "Säule mit allen Themen löschen?"; return; } var c = clone(cfg()); c.pillars.splice(Number(el.dataset.i), 1); closeDlg(); saveConfig(c); },
    "add-topic": function (el) { openTopic(Number(el.dataset.i), null); },
    "edit-topic": function (el) { openTopic(Number(el.dataset.i), Number(el.dataset.j)); },
    "save-topic": function (el) {
      var c = clone(cfg()), pi = Number(el.dataset.i), to = Number(val("tp-pillar")), name = val("tp-name").trim(); if (!name) { toast("Bitte einen Namen eingeben."); return; }
      var t;
      if (el.dataset.j === "") t = { id: uidGen("t"), name: name, desc: val("tp-desc").trim() };
      else { t = c.pillars[pi].topics.splice(Number(el.dataset.j), 1)[0]; t.name = name; t.desc = val("tp-desc").trim(); }
      c.pillars[to].topics = c.pillars[to].topics || []; c.pillars[to].topics.push(t);
      closeDlg(); saveConfig(c);
    },
    "del-topic": function (el) { if (el.dataset.confirm !== "1") { el.dataset.confirm = "1"; el.textContent = "Wirklich löschen?"; return; } var c = clone(cfg()); c.pillars[Number(el.dataset.i)].topics.splice(Number(el.dataset.j), 1); closeDlg(); saveConfig(c); },
    "pillar-ai": runPillarAi,
    "pillar-ai-take": function () { var c = clone(cfg()); S.pillarAi.result.forEach(function (p) { c.pillars.push({ id: uidGen("p"), name: p.name, desc: p.desc, share: p.share, topics: p.topics.map(function (t) { return { id: uidGen("t"), name: t, desc: "" }; }) }); }); S.pillarAi = { text: "", busy: false, result: null }; saveConfig(c); toast("Themensäulen übernommen"); },
    "pillar-ai-drop": function () { S.pillarAi.result = null; render(true); },
    "add-person": function () { var p = { id: uidGen("pe"), name: "Neue Person", role: "", channels: [], mdChannels: [], canApprove: false, isLead: false, active: true }; savePerson(p); },
    "del-person": function (el) { if (el.dataset.confirm !== "1") { el.dataset.confirm = "1"; el.textContent = "wirklich?"; return; } delDoc("people/" + el.dataset.id).catch(function () {}); },
    "unlink": function (el) { var p = clone(person(el.dataset.id)); if (!p) return; delete p.userId; savePerson(p); },
    "add-channel": function () { var c = clone(cfg()); c.channels.push({ id: uidGen("c"), name: "Neuer Kanal", color: "#888888" }); saveConfig(c); },
    "del-channel": function (el) { if (el.dataset.confirm !== "1") { el.dataset.confirm = "1"; el.textContent = "wirklich?"; return; } var c = clone(cfg()); c.channels.splice(Number(el.dataset.i), 1); saveConfig(c); },
    "add-cat": function () { var c = clone(cfg()); c.categories.push({ id: uidGen("k"), name: "Neue Kategorie", group: "intern-offline", blocker: false, steps: [] }); saveConfig(c); },
    "del-cat": function (el) { if (el.dataset.confirm !== "1") { el.dataset.confirm = "1"; el.textContent = "Wirklich löschen?"; return; } var c = clone(cfg()); c.categories.splice(Number(el.dataset.i), 1); saveConfig(c); },
    "add-step": function (el) { var c = clone(cfg()), cat = c.categories[Number(el.dataset.i)]; cat.steps = cat.steps || []; cat.steps.push({ offset: -7, channel: "instagram", title: "Neuer Schritt" }); saveConfig(c); },
    "del-step": function (el) { var c = clone(cfg()); c.categories[Number(el.dataset.i)].steps.splice(Number(el.dataset.j), 1); saveConfig(c); },
    "export": exportAll
  };
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]"); if (!el) return;
    var fn = A[el.dataset.act]; if (!fn) return;
    if (el.tagName === "A") return;
    e.preventDefault(); fn(el);
  });
  document.addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches(".li[data-act], tr[data-act]")) { e.preventDefault(); A[e.target.dataset.act](e.target); }
  });

  boot();
})();
</script>
